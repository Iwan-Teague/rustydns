[package]
name        = "rustydns-resolver"
version     = "0.1.0"
description = "Recursive resolver with DoH/DoQ upstream, DNSSEC, query minimisation, no ECS"
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
rustydns-core    = { path = "../rustydns-core", version = "0.1.0" }
hickory-resolver = { workspace = true }
# `dnssec-ring` for the client-side DNSSEC validator the ODoH arm wraps
# (TrustAnchors/DnssecSummary live behind it). hickory-resolver also enables it,
# but pin it here so the resolver doesn't depend on feature unification.
hickory-proto    = { workspace = true, features = ["dnssec-ring"] }
tokio            = { workspace = true }
tracing          = { workspace = true }
thiserror        = { workspace = true }
# Resolver builds the TLS config explicitly so `upstream.min_tls_version`
# actually pins the floor (hickory 0.26's rustls 0.23 matches the
# workspace).
rustls           = { workspace = true }
webpki-roots     = "1"
rustls-pki-types.workspace = true
# Oblivious DoH (RFC 9230) upstream arm: HPKE via odoh-rs, the HTTPS relay
# hop via reqwest (rustls, TLS floor honoured), bytes for odoh-rs (de)serialise,
# arc-swap for the lazily-fetched-and-refreshable ODoHConfig cache.
odoh-rs          = { workspace = true }
bytes            = { workspace = true }
reqwest          = { workspace = true }
arc-swap         = { workspace = true }
# hpke 0.13 (via odoh-rs) needs a rand_core-0.9 CSPRNG; the workspace pins
# rand 0.8 (a different, incompatible major) for other crates, so pin 0.9 here.
rand             = "0.10"

[dev-dependencies]
tokio        = { workspace = true }
# Integration tests use a tiny in-process UDP mock DNS server to drive
# the resolver end-to-end. hickory-proto encodes/decodes the wire
# messages and tokio-util gives us a CancellationToken for clean
# server shutdown between tests.
tokio-util   = { workspace = true }
# `time` (matches hickory's pin) for RRSIG inception/expiration timestamps when
# the DNSSEC-over-ODoH test signs a throwaway zone with hickory's signer.
time         = "0.3"
# The TLS-1.3-floor test stands up a real TLS-1.2-only listener and drives the
# client config `build_tls_client_config` produces against it (no DoH/HTTP — the
# property under test is purely the negotiated TLS floor). The embedded
# self-signed localhost cert is parsed via `rustls_pki_types::pem` (already a
# resolver dependency).
tokio-rustls = { workspace = true }
