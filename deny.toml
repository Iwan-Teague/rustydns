# cargo-deny configuration for rustydns.
#
# Run locally with: `cargo install cargo-deny && cargo deny check`
# CI runs `cargo deny check` on every push / PR (see .github/workflows/ci.yml).
#
# The four sub-commands cargo-deny runs:
#   - advisories: known security advisories
#   - bans:       banned crates / banned versions / duplicate detection
#   - licenses:   SPDX expression allowlist
#   - sources:    only registries/git sources we trust

# ---------------------------------------------------------------------------
# Advisory database
# ---------------------------------------------------------------------------
[advisories]
version = 2
# Pull from the official RustSec advisory DB.
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Deny-by-default: every advisory class is checked across the whole
# graph and fails CI unless a crate is explicitly ignored below with a
# rationale and a removal trigger. (cargo-deny >= 0.20: the
# `vulnerability` key was removed — vulns are always errors — and
# unmaintained/unsound take a *scope*; their diagnostics are errors.)
unmaintained = "all"
unsound = "all"
# Yanked crates aren't an immediate vulnerability but they shouldn't
# end up in a release either — fail CI so we notice before shipping.
yanked = "deny"
# Ignored advisories carry a rationale and a removal trigger.
ignore = [
    # chacha20 0.10.0 in Cargo.lock is yanked upstream; it enters the
    # graph via rand 0.10.1 ← hickory-net 0.26.1. Cargo.lock updates
    # are handled outside deny.toml — run `cargo update -p chacha20`
    # once hickory publishes a compatible refresh, then REMOVE this.
    { crate = "chacha20", reason = "yanked 0.10.0 via rand/hickory; bump lock with cargo update -p chacha20" },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# AGENTS.md forbids the openssl C bindings ("rustls backend only, no
# openssl") and the old unmaintained trust-dns crate family.
multiple-versions = "deny"  # duplicates must be skip-listed below with a reason
wildcards = "deny"          # `foo = "*"` deps are forbidden
# Workspace-internal path deps don't carry version constraints; that's
# correct usage (cargo resolves them via the path) but cargo-deny
# treats it as a wildcard without this opt-in.
allow-wildcard-paths = true

deny = [
    # AGENTS.md "do not introduce" list.
    { name = "openssl-sys" },
    { name = "openssl" },
    { name = "native-tls" },
    # trust-dns-* is the old unmaintained name for the hickory family.
    { name = "trust-dns-proto" },
    { name = "trust-dns-resolver" },
    { name = "trust-dns-server" },
    { name = "trust-dns-client" },
]

# Real duplicates in the current graph (verified with cargo-deny
# 0.20.2, 2026-09-12). Each is a genuine version skew from upstream
# ecosystems we don't control — mostly the rand/digest 0.9→0.10
# migration window and the old-vs-new Windows target stacks. They fail
# the `multiple-versions = "deny"` lint unless skipped here; prune
# entries as upstream collapses the duplicates.
skip = [
    { crate = "block-buffer", reason = "rand 0.9 vs 0.10 dependency windows" },
    { crate = "chacha20", reason = "rand 0.9 vs 0.10 dependency windows" },
    { crate = "core-foundation", reason = "macOS target stack skew (io/8.x)" },
    { crate = "cpufeatures", reason = "digest 0.10 internal skew" },
    { crate = "crypto-common", reason = "rand 0.9 vs 0.10 dependency windows" },
    { crate = "digest", reason = "digest 0.10 point releases via sha2/chacha20" },
    { crate = "getrandom", reason = "getrandom 0.2 vs 0.3 migration (ring/rand/wasm)" },
    { crate = "jni", reason = "Android target stack skew (getrandom/wasm)" },
    { crate = "jni-sys", reason = "Android target stack skew (getrandom/wasm)" },
    { crate = "r-efi", reason = "UEFI target stack skew (getrandom)" },
    { crate = "rand", reason = "rand 0.9 vs 0.10 migration (hickory)" },
    { crate = "rand_core", reason = "rand 0.9 vs 0.10 migration (hickory)" },
    { crate = "sha2", reason = "digest point releases via rand/hickory" },
    { crate = "thiserror", reason = "thiserror 1.x vs 2.x migration (transitive)" },
    { crate = "thiserror-impl", reason = "thiserror 1.x vs 2.x migration (transitive)" },
    { crate = "windows-sys", reason = "windows-sys 0.52/0.59/0.61 via multiple stacks" },
    { crate = "windows-targets", reason = "old vs new Windows target stacks" },
    { crate = "windows_aarch64_gnullvm", reason = "old vs new Windows target stacks" },
    { crate = "windows_aarch64_msvc", reason = "old vs new Windows target stacks" },
    { crate = "windows_i686_gnu", reason = "old vs new Windows target stacks" },
    { crate = "windows_i686_gnullvm", reason = "old vs new Windows target stacks" },
    { crate = "windows_i686_msvc", reason = "old vs new Windows target stacks" },
    { crate = "windows_x86_64_gnu", reason = "old vs new Windows target stacks" },
    { crate = "windows_x86_64_gnullvm", reason = "old vs new Windows target stacks" },
    { crate = "windows_x86_64_msvc", reason = "old vs new Windows target stacks" },
    { crate = "wit-bindgen", reason = "wasi target stack skew (getrandom 0.3)" },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
version = 2
# Workspace ships under PolyForm Noncommercial 1.0.0; allow that plus the
# standard set of permissive licenses we'd be comfortable shipping. Add to
# this list explicitly rather than relaxing the policy.
allow = [
    # ADR-021 (round 2): suite relicensed to PolyForm Noncommercial 1.0.0.
    # SPDX-valid (id: PolyForm-Noncommercial-1.0.0) but NOT OSI-approved;
    # cargo-deny resolves the id directly from crate manifests, so no
    # [licenses.clarify] stanza is required.
    "PolyForm-Noncommercial-1.0.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    # Mozilla's Community Data License — used by `webpki-roots` (the
    # CA bundle itself is "data" rather than "code"). Permissive.
    "CDLA-Permissive-2.0",
    # crypto-grade primitives that distribute under the OpenSSL or
    # equivalent compatible licenses — `ring` lives here.
    "OpenSSL",
]
confidence-threshold = 0.93

# A handful of crates ship without a SPDX expression in their
# manifest but DO carry a recognised LICENSE file at their root.
# `ring` is the canonical example.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND OpenSSL AND MIT"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
# Only the official crates.io registry. Any git dep would have to be
# explicitly allowlisted; we don't pull any today.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
