# rustydnsd — example docker-compose deployment.
#
# Intended as an opinionated starting point, not a one-size-fits-all. The
# defaults below match the security posture documented in AGENTS.md:
#   - read-only root filesystem
#   - non-root user (set in the image, not here)
#   - dropped capabilities except CAP_NET_BIND_SERVICE (needed for :53)
#   - no Docker secrets exposed via env — config is mounted as a file
#   - metrics endpoint stays inside the container network (loopback-only
#     by design; scrape from a sidecar if you need it externally)
#
# Usage:
#   1. Copy rustydns.docker.toml to ./rustydns.toml and edit it.
#      (NOT rustydns.example.toml — that template binds 127.0.0.1, which is
#      unreachable through Docker's published ports. The .docker template
#      binds 0.0.0.0 for the container; exposure stays governed by what
#      you publish under `ports:` below.)
#      Then `chmod 640 rustydns.toml`: the daemon refuses to start if the
#      config is world-readable, and a world-readable mount crash-loops
#      under restart=unless-stopped.
#   2. If you use the Rustynet mesh feature, drop the signed
#      `dns-zone.bundle` and its hex-encoded ed25519 verifier key
#      `dns-zone-verifier.key` into ./mesh/ — these are the artifact names
#      rustynetd writes and the paths the example config expects.
#   3. `docker compose up -d`
#
# To upgrade later: `docker compose pull && docker compose up -d`.

services:
  rustydnsd:
    build: .
    # When publishing images, swap `build:` for an explicit tag, e.g.:
    # image: ghcr.io/iwan-teague/rustydnsd:0.1.0
    container_name: rustydnsd
    restart: unless-stopped

    # Bind the DNS ports. UDP+TCP/53 for plain DNS, TCP/853 for DoT.
    # DoQ (DNS-over-QUIC) is UDP/853 — uncomment the mapping below if you
    # set `doq_listen` in rustydns.toml.
    # TCP/8053 (DoH) is intentionally NOT published: the DoH listener speaks
    # PLAINTEXT HTTP/2 and binds 127.0.0.1 inside the container (the daemon
    # refuses a non-loopback bind without TLS configured — and note the
    # cert/key config only PERMITS such a bind; it never makes the DoH port
    # itself TLS). To expose DoH, run a TLS-terminating reverse proxy that
    # forwards to 127.0.0.1:8053 and publish only the proxy's HTTPS port.
    # The proxy MUST join rustydnsd's network namespace to reach the
    # loopback bind:
    #   doh-proxy:
    #     image: <your-proxy>
    #     network_mode: "service:rustydnsd"   # share rustydnsd's netns
    #     # ...proxy 443 -> 127.0.0.1:8053; publish 443 here or via a
    #     # further front container — ports on this service apply to the
    #     # shared netns, so declare them on the proxy.
    # The /metrics + /health + /queries endpoint on :9153 is intentionally
    # NOT published — keep it loopback-only and scrape via a sidecar that
    # joins this container's network namespace.
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      # - "853:853/udp"   # DoQ (RFC 9250); enable with server.doq_listen
      # - "8053:8053/tcp" # DoH: loopback-only in-container, PLAINTEXT HTTP/2
      #                   # (cert/key never make it TLS) — front with a
      #                   # TLS-terminating reverse proxy instead; the proxy
      #                   # needs network_mode: "service:rustydnsd" to reach
      #                   # 127.0.0.1:8053.

    # Read-only rootfs. The daemon writes nothing to its image; the only
    # writable surfaces are the explicit volumes below and a tmpfs for
    # /tmp (rustls + tokio occasionally need scratch space).
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777

    # Drop everything except the one capability the daemon needs to bind
    # privileged ports. `setcap` on the binary is the in-container
    # equivalent, but cap_add here makes the intent explicit at the
    # orchestrator level and survives image rebuilds that forget setcap.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Defence in depth: refuse setuid escalation inside the container.
    security_opt:
      - no-new-privileges:true

    # Mounts. Config is read-only; the mesh bundle directory is read-only
    # because rustydns never writes to it (rustynetd publishes out of band).
    # Mounted at /var/lib/rustynet — the same paths the example config's
    # mesh_zone_bundle_path / mesh_zone_verifier_key_path point to.
    # ./blocklists backs the local_files entries in rustydns.docker.toml;
    # drop the mount if you use only remote sources.
    volumes:
      - ./rustydns.toml:/etc/rustydns/rustydns.toml:ro
      - ./mesh:/var/lib/rustynet:ro
      - ./blocklists:/var/lib/rustydns/blocklists:ro

    # Compose-level healthcheck mirrors the one baked into the image so
    # `docker compose ps` shows accurate state. Override here if you've
    # moved the metrics port in rustydns.toml. debian-slim ships no
    # wget/curl, so the probe uses bash's built-in /dev/tcp (bash and grep
    # are Essential packages present even in -slim).
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/9153; printf "GET /health HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

    # Conservative logging cap. Without this, journald/json-file can
    # eat the disk if the daemon ever ends up in a tight log loop
    # (e.g. a misconfigured upstream).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
